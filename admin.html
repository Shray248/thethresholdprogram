<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HQ — The Threshold Program</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ══════════════════════════════════════════
       RESET & BASE
       ══════════════════════════════════════════ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html { font-size: 16px; }

    body {
      background: #050505;
      color: #e4e4e7;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    ::selection {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    /* ══════════════════════════════════════════
       NAV
       ══════════════════════════════════════════ */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      background: rgba(5,5,5,0.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-brand svg {
      width: 22px;
      height: 26px;
    }

    .nav-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #71717a;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-user {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #52525b;
    }

    .nav-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #52525b;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-btn:hover { color: #ffffff; }

    /* ══════════════════════════════════════════
       MAIN LAYOUT
       ══════════════════════════════════════════ */
    .main {
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 28px 80px;
      width: 100%;
    }

    /* ── States ──────────────────────────── */
    .state-loading,
    .state-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 0;
      text-align: center;
    }

    .hidden { display: none !important; }

    .spinner-lg {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(255,255,255,0.08);
      border-top-color: #a1a1aa;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    .state-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #3f3f46;
    }

    .error-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 20px;
      color: #71717a;
    }

    .error-title {
      font-family: 'Archivo', sans-serif;
      font-weight: 700;
      font-size: 28px;
      color: #e4e4e7;
      margin-bottom: 8px;
    }

    .error-msg {
      font-size: 14px;
      color: #52525b;
      margin-bottom: 24px;
    }

    .error-link {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #a1a1aa;
      text-decoration: none;
      padding: 10px 24px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      transition: border-color 0.2s, color 0.2s;
    }

    .error-link:hover {
      border-color: rgba(255,255,255,0.2);
      color: #fff;
    }

    /* ── Login Form ──────────────────────── */
    .login-form {
      max-width: 400px;
      margin: 0 auto;
      padding: 120px 0;
    }

    .login-title {
      font-family: 'Archivo', sans-serif;
      font-weight: 700;
      font-size: 28px;
      text-align: center;
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 13px;
      color: #52525b;
      text-align: center;
      margin-bottom: 32px;
    }

    .login-group {
      margin-bottom: 16px;
    }

    .login-label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #71717a;
      margin-bottom: 6px;
    }

    .login-input {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-input:focus {
      border-color: rgba(255,255,255,0.2);
    }

    .login-btn {
      width: 100%;
      background: #fff;
      color: #000;
      font-family: 'Archivo', sans-serif;
      font-weight: 700;
      font-size: 14px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.15s;
    }

    .login-btn:hover {
      background: #e4e4e7;
      transform: translateY(-1px);
    }

    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .login-error {
      display: none;
      background: rgba(220,38,38,0.1);
      border: 1px solid rgba(220,38,38,0.15);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #fca5a5;
      margin-bottom: 16px;
    }

    .login-error.visible { display: block; }

    /* ══════════════════════════════════════════
       DASHBOARD HEADER
       ══════════════════════════════════════════ */
    .dash-header {
      margin-bottom: 36px;
    }

    .dash-title {
      font-family: 'Archivo', sans-serif;
      font-weight: 800;
      font-size: clamp(28px, 4vw, 40px);
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .dash-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #3f3f46;
    }

    /* ══════════════════════════════════════════
       STATS GRID
       ══════════════════════════════════════════ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: #0a0a0a;
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 20px;
    }

    .stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #52525b;
      margin-bottom: 8px;
    }

    .stat-value {
      font-family: 'Archivo', sans-serif;
      font-weight: 700;
      font-size: 28px;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .stat-value.accent {
      color: #22c55e;
    }

    /* ══════════════════════════════════════════
       ORDERS TABLE
       ══════════════════════════════════════════ */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .section-title {
      font-family: 'Archivo', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: #ffffff;
    }

    .search-bar {
      display: flex;
      gap: 8px;
    }

    .search-input {
      background: #0a0a0a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 8px 12px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #fff;
      outline: none;
      min-width: 200px;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: rgba(255,255,255,0.2);
    }

    .search-input::placeholder {
      color: #3f3f46;
    }

    .filter-select {
      background: #0a0a0a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 8px 12px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #a1a1aa;
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      min-width: 120px;
    }

    .filter-select option {
      background: #0a0a0a;
    }

    .search-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 8px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #a1a1aa;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .search-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    .table-wrapper {
      background: #0a0a0a;
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    thead tr {
      border-bottom: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.02);
    }

    th {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #52525b;
      font-weight: 400;
      padding: 14px 18px;
      white-space: nowrap;
    }

    td {
      padding: 14px 18px;
      font-size: 13px;
      color: #a1a1aa;
      vertical-align: middle;
      border-bottom: 1px solid rgba(255,255,255,0.02);
    }

    tr:hover td {
      background: rgba(255,255,255,0.01);
    }

    .buyer-name {
      color: #e4e4e7;
      font-weight: 500;
      font-size: 14px;
    }

    .buyer-meta {
      font-size: 12px;
      color: #52525b;
      margin-top: 2px;
    }

    /* Status badges */
    .badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 500;
    }

    .badge-completed {
      background: rgba(34,197,94,0.1);
      color: #4ade80;
      border: 1px solid rgba(34,197,94,0.15);
    }

    .badge-pending {
      background: rgba(250,204,21,0.1);
      color: #fde047;
      border: 1px solid rgba(250,204,21,0.15);
    }

    .badge-failed {
      background: rgba(239,68,68,0.1);
      color: #f87171;
      border: 1px solid rgba(239,68,68,0.15);
    }

    .badge-refunded {
      background: rgba(168,85,247,0.1);
      color: #c084fc;
      border: 1px solid rgba(168,85,247,0.15);
    }

    .amount-cell {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #e4e4e7;
    }

    .date-cell {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #52525b;
    }

    .detail-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #52525b;
      background: none;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 4px;
      padding: 5px 12px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .detail-btn:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.2);
    }

    .empty-row td {
      text-align: center;
      padding: 40px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #3f3f46;
    }

    /* Pagination */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #52525b;
    }

    .pagination-btns {
      display: flex;
      gap: 8px;
    }

    .page-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: #0a0a0a;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 4px;
      padding: 6px 14px;
      color: #a1a1aa;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .page-btn:hover:not(:disabled) {
      border-color: rgba(255,255,255,0.2);
      color: #fff;
    }

    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* ══════════════════════════════════════════
       ORDER DETAIL MODAL
       ══════════════════════════════════════════ */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal {
      background: #0d0d0d;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      transform: scale(0.97);
      transition: transform 0.2s;
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .modal-title {
      font-family: 'Archivo', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: #fff;
    }

    .modal-close {
      background: none;
      border: none;
      color: #52525b;
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: #fff;
    }

    .modal-field {
      margin-bottom: 16px;
    }

    .modal-field-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #52525b;
      margin-bottom: 4px;
    }

    .modal-field-value {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #e4e4e7;
      word-break: break-word;
    }

    .modal-field-value.mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #a1a1aa;
    }

    .modal-divider {
      height: 1px;
      background: rgba(255,255,255,0.04);
      margin: 20px 0;
    }

    .modal-status-group {
      margin-top: 16px;
    }

    .modal-status-select {
      background: #050505;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 10px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #e4e4e7;
      outline: none;
      width: 100%;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .modal-status-select option {
      background: #0d0d0d;
    }

    .modal-save-btn {
      width: 100%;
      background: #fff;
      color: #000;
      font-family: 'Archivo', sans-serif;
      font-weight: 700;
      font-size: 13px;
      padding: 11px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .modal-save-btn:hover {
      background: #e4e4e7;
    }

    .modal-save-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ══════════════════════════════════════════
       ANIMATIONS
       ══════════════════════════════════════════ */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeIn 0.5s ease-out forwards;
    }

    /* ══════════════════════════════════════════
       RESPONSIVE
       ══════════════════════════════════════════ */
    @media (max-width: 768px) {
      .main { padding: 24px 16px 60px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .section-header { flex-direction: column; align-items: flex-start; }
      .search-bar { width: 100%; flex-wrap: wrap; }
      .search-input { min-width: 0; flex: 1; }
      .nav-user { display: none; }
    }

    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #050505; }
    ::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #2a2a2a; }
  </style>
</head>

<body>
  <!-- ══════ NAV ══════ -->
  <nav class="nav">
    <div class="nav-brand">
      <svg viewBox="0 0 72 88" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M36 8 C34 28, 38 44, 36 80" stroke="#71717a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M12 32 C20 28, 52 28, 60 32" stroke="#71717a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M28 80 C32 78, 40 78, 44 80" stroke="#71717a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      </svg>
      <span class="nav-title">Headquarters</span>
    </div>
    <div class="nav-actions">
      <span class="nav-user" id="admin-email"></span>
      <button class="nav-btn" onclick="handleLogout()" id="logout-btn" style="display:none;">Logout</button>
    </div>
  </nav>

  <!-- ══════ MAIN CONTENT ══════ -->
  <main class="main">

    <!-- State: Loading -->
    <div class="state-loading" id="state-loading">
      <div class="spinner-lg"></div>
      <p class="state-text">Authenticating...</p>
    </div>

    <!-- State: Login -->
    <div class="login-form hidden" id="state-login">
      <h1 class="login-title">Admin Login</h1>
      <p class="login-subtitle">Enter your credentials to access the dashboard.</p>
      <div class="login-error" id="login-error"></div>
      <form onsubmit="handleLogin(event)">
        <div class="login-group">
          <label class="login-label" for="login-email">Email</label>
          <input type="email" id="login-email" class="login-input" placeholder="admin@threshold.in" required autocomplete="email" />
        </div>
        <div class="login-group">
          <label class="login-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="login-input" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="login-btn" id="login-btn">Sign In</button>
      </form>
    </div>

    <!-- State: Dashboard -->
    <div class="hidden" id="state-dashboard">

      <!-- Header -->
      <div class="dash-header fade-in">
        <h1 class="dash-title">Dashboard</h1>
        <p class="dash-subtitle">Order Management & Revenue Analytics</p>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid fade-in">
        <div class="stat-card">
          <p class="stat-label">Total Orders</p>
          <p class="stat-value" id="stat-total">—</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Completed</p>
          <p class="stat-value accent" id="stat-completed">—</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Pending</p>
          <p class="stat-value" id="stat-pending">—</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Total Revenue</p>
          <p class="stat-value" id="stat-revenue">—</p>
        </div>
      </div>

      <!-- Orders Table -->
      <div>
        <div class="section-header">
          <h2 class="section-title">Orders</h2>
          <div class="search-bar">
            <input type="text" id="search-input" class="search-input" placeholder="Search email, phone, name..." />
            <select id="filter-status" class="filter-select" onchange="fetchOrders(1)">
              <option value="">All Status</option>
              <option value="COMPLETED">Completed</option>
              <option value="PENDING">Pending</option>
              <option value="FAILED">Failed</option>
              <option value="REFUNDED">Refunded</option>
            </select>
            <button class="search-btn" onclick="fetchOrders(1)">Search</button>
          </div>
        </div>

        <div class="table-wrapper">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Buyer</th>
                  <th>Amount</th>
                  <th>Status</th>
                  <th>Date</th>
                  <th style="text-align:right;">Action</th>
                </tr>
              </thead>
              <tbody id="orders-tbody">
                <tr class="empty-row"><td colspan="5">Loading orders...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="pagination">
          <span id="pagination-info">—</span>
          <div class="pagination-btns">
            <button class="page-btn" id="btn-prev" disabled onclick="prevPage()">Prev</button>
            <button class="page-btn" id="btn-next" disabled onclick="nextPage()">Next</button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- ══════ ORDER DETAIL MODAL ══════ -->
  <div class="modal-overlay" id="order-modal" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Order Details</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div id="modal-body">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>


  <!-- ═══════════════════════════════════════════
       SCRIPTS
       ═══════════════════════════════════════════ -->
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
