<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apply — The Threshold Program</title>
  <meta name="description" content="Apply for The Threshold Program — 7 live one-on-one sessions over 7 days to cross your threshold phase." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ══════════════════════════════════════════
       RESET & BASE
       ══════════════════════════════════════════ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      background: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      line-height: 1.6;
      min-height: 100vh;
    }

    ::selection {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    /* ══════════════════════════════════════════
       BACK LINK
       ══════════════════════════════════════════ */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #71717a;
      text-decoration: none;
      padding: 24px;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: #a1a1aa;
    }

    .back-link svg {
      width: 16px;
      height: 16px;
    }

    /* ══════════════════════════════════════════
       APPLICATION CONTAINER
       ══════════════════════════════════════════ */
    .application {
      max-width: 560px;
      margin: 0 auto;
      padding: 20px 24px 80px;
    }

    /* ── Header ─────────────────────────── */
    .app-header {
      text-align: center;
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.1s forwards;
    }

    .app-logo {
      margin-bottom: 32px;
    }

    .app-logo svg {
      width: 44px;
      height: 44px;
    }

    .app-step {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #52525b;
      margin-bottom: 16px;
    }

    .app-title {
      font-family: 'Archivo', sans-serif;
      font-weight: 700;
      font-size: clamp(24px, 5vw, 36px);
      color: #ffffff;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .app-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #71717a;
      line-height: 1.6;
    }

    /* ── Form ───────────────────────────── */
    .app-form {
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.3s forwards;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #a1a1aa;
      margin-bottom: 8px;
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 14px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    .form-input::placeholder,
    .form-textarea::placeholder {
      color: #3f3f46;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
    }

    .form-select {
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%2371717a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 16px center;
      padding-right: 44px;
      cursor: pointer;
    }

    .form-select option {
      background: #0d0d0d;
      color: #ffffff;
    }

    .form-textarea {
      resize: vertical;
      min-height: 100px;
      line-height: 1.6;
    }

    /* ── Radio Group ────────────────────── */
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0d0d0d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color 0.25s ease, background 0.25s ease;
    }

    .radio-option:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .radio-option input[type="radio"] {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid #3f3f46;
      border-radius: 50%;
      flex-shrink: 0;
      display: grid;
      place-content: center;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .radio-option input[type="radio"]::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffffff;
      transform: scale(0);
      transition: transform 0.15s ease;
    }

    .radio-option input[type="radio"]:checked {
      border-color: #ffffff;
    }

    .radio-option input[type="radio"]:checked::before {
      transform: scale(1);
    }

    .radio-option.selected {
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.02);
    }

    .radio-label {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #d4d4d8;
      cursor: pointer;
    }

    /* ── Divider ────────────────────────── */
    .form-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.05);
      margin: 32px 0;
    }

    /* ── Submit Button ──────────────────── */
    .submit-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #ffffff;
      color: #000000;
      font-family: 'Archivo', sans-serif;
      font-weight: 700;
      font-size: 15px;
      padding: 16px 36px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 8px;
    }

    .submit-button:hover {
      background: #e4e4e7;
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(255, 255, 255, 0.1);
    }

    .submit-button:active {
      transform: translateY(0);
    }

    .submit-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .submit-button .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    .submit-button.loading .spinner {
      display: inline-block;
    }

    .submit-button.loading .btn-text,
    .submit-button.loading .chevron {
      display: none;
    }

    .submit-note {
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: #52525b;
      margin-top: 16px;
      line-height: 1.6;
    }

    /* ── Error Message ──────────────────── */
    .form-error {
      display: none;
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.2);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #fca5a5;
    }

    .form-error.visible {
      display: block;
    }

    /* ── Price Summary ──────────────────── */
    .price-summary {
      background: #0d0d0d;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .price-label {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #a1a1aa;
    }

    .price-amount {
      font-family: 'Archivo', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: #ffffff;
    }

    /* ══════════════════════════════════════════
       ANIMATIONS
       ══════════════════════════════════════════ */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ══════════════════════════════════════════
       RESPONSIVE
       ══════════════════════════════════════════ */
    @media (max-width: 640px) {
      .application {
        padding: 12px 20px 60px;
      }

      .app-title {
        font-size: 24px;
      }

      .form-input,
      .form-select,
      .form-textarea,
      .radio-option {
        padding: 12px 14px;
      }
    }

    /* ══════════════════════════════════════════
       CUSTOM SCROLLBAR
       ══════════════════════════════════════════ */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #000;
    }

    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
  </style>
</head>

<body>

<!-- Back Link -->
<a href="/" class="back-link">
  <svg viewBox="0 0 16 16" fill="none">
    <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  Back
</a>

<!-- Application Form -->
<div class="application">
  <!-- Header -->
  <div class="app-header">
    <div class="app-logo">
      <svg viewBox="0 0 72 88" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="The Threshold Program">
        <path d="M36 8 C34 28, 38 44, 36 80" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M12 32 C20 28, 52 28, 60 32" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M28 80 C32 78, 40 78, 44 80" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <p class="app-step">Application</p>
    <h1 class="app-title">Join The Threshold Program</h1>
    <p class="app-subtitle">Fill out the form below. After submitting, you'll be directed to complete your payment securely via Razorpay.</p>
  </div>

  <!-- Form -->
  <form class="app-form" id="application-form" onsubmit="handleApplication(event)">

    <!-- Error Banner -->
    <div class="form-error" id="form-error"></div>

    <!-- Name -->
    <div class="form-group">
      <label class="form-label" for="field-name">Your Name *</label>
      <input type="text" id="field-name" name="name" class="form-input" placeholder="Full name" required autocomplete="name" />
    </div>

    <!-- Email -->
    <div class="form-group">
      <label class="form-label" for="field-email">Email Address *</label>
      <input type="email" id="field-email" name="email" class="form-input" placeholder="you@example.com" required autocomplete="email" />
    </div>

    <!-- Phone -->
    <div class="form-group">
      <label class="form-label" for="field-phone">Phone Number *</label>
      <input type="tel" id="field-phone" name="phone" class="form-input" placeholder="+91 98765 43210" required autocomplete="tel" />
    </div>

    <!-- Instagram (optional) -->
    <div class="form-group">
      <label class="form-label" for="field-instagram">Instagram Handle <span style="color: #52525b; text-transform: none; letter-spacing: normal;">(optional)</span></label>
      <input type="text" id="field-instagram" name="instagram" class="form-input" placeholder="@yourhandle" autocomplete="off" />
    </div>

    <div class="form-divider"></div>

    <!-- Current Situation -->
    <div class="form-group">
      <label class="form-label" for="field-situation">Describe your current situation *</label>
      <select id="field-situation" name="currentSituation" class="form-select" required>
        <option value="" disabled selected>Select the one that resonates most</option>
        <option value="stuck_in_loop">I feel stuck in the same patterns and can't break through</option>
        <option value="lack_clarity">I lack clarity on what's actually holding me back</option>
        <option value="surface_changes">I've tried surface-level changes but nothing sticks</option>
        <option value="growth_plateau">I've hit a growth plateau — personally or professionally</option>
        <option value="inner_conflict">I'm dealing with inner conflict and self-sabotage</option>
        <option value="ready_for_change">I know I need deep change but don't know where to start</option>
        <option value="other">Something else entirely</option>
      </select>
    </div>

    <!-- Investment Capacity -->
    <div class="form-group">
      <label class="form-label">Are you ready to invest ₹24,500 in yourself right now? *</label>
      <div class="radio-group" id="investment-group">
        <label class="radio-option" onclick="selectRadio(this)">
          <input type="radio" name="investmentCapacity" value="YES" required />
          <span class="radio-label">Yes — I'm ready and committed</span>
        </label>
        <label class="radio-option" onclick="selectRadio(this)">
          <input type="radio" name="investmentCapacity" value="POSSIBLY" />
          <span class="radio-label">I need to think about it, but I'm interested</span>
        </label>
        <label class="radio-option" onclick="selectRadio(this)">
          <input type="radio" name="investmentCapacity" value="NO" />
          <span class="radio-label">Not right now</span>
        </label>
      </div>
    </div>

    <div class="form-divider"></div>

    <!-- Price Summary -->
    <div class="price-summary">
      <span class="price-label">7-Day Program (7 Sessions)</span>
      <span class="price-amount">₹24,500</span>
    </div>

    <!-- Submit -->
    <button type="submit" class="submit-button" id="submit-btn">
      <span class="btn-text">Submit & Proceed to Payment</span>
      <span class="chevron">›</span>
      <div class="spinner"></div>
    </button>

    <p class="submit-note">
      Secure payment powered by Razorpay. Your details are encrypted and safe.
    </p>
  </form>
</div>


<!-- ═══════════════════════════════════════════
     SCRIPTS
     ═══════════════════════════════════════════ -->
<script src="/js/api.js"></script>
<script>
  // ── Radio selection visual feedback ────────
  function selectRadio(el) {
    const group = el.closest('.radio-group');
    group.querySelectorAll('.radio-option').forEach(opt => opt.classList.remove('selected'));
    el.classList.add('selected');
  }

  // ── Form submission handler ────────────────
  async function handleApplication(e) {
    e.preventDefault();

    const btn = document.getElementById('submit-btn');
    const errorEl = document.getElementById('form-error');

    // Reset error
    errorEl.classList.remove('visible');
    errorEl.textContent = '';

    // Gather form data
    const name = document.getElementById('field-name').value.trim();
    const email = document.getElementById('field-email').value.trim();
    const phone = document.getElementById('field-phone').value.trim();
    const instagram = document.getElementById('field-instagram').value.trim();
    const currentSituation = document.getElementById('field-situation').value;
    const investmentRadio = document.querySelector('input[name="investmentCapacity"]:checked');

    // Validate
    if (!name || !email || !phone) {
      showError('Please fill in all required fields.');
      return;
    }

    if (!currentSituation) {
      showError('Please select your current situation.');
      return;
    }

    if (!investmentRadio) {
      showError('Please select your investment readiness.');
      return;
    }

    const investmentCapacity = investmentRadio.value;

    // If "NO" or "POSSIBLY" — still allow but show gentle message
    // (You can change this to block if you want)

    // Show loading
    btn.classList.add('loading');
    btn.disabled = true;

    try {
      await api.payments.initiateCheckout({
        name,
        email,
        phone,
        instagram: instagram || undefined,
        currentSituation,
        investmentCapacity,
      });
    } catch (err) {
      showError(err.message || 'Could not start checkout. Please try again.');
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  }

  function showError(msg) {
    const errorEl = document.getElementById('form-error');
    errorEl.textContent = msg;
    errorEl.classList.add('visible');
    errorEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
</script>

</body>
</html>
