<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Threshold Program — Portal</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            charcoal: '#0a0a0a',
            surface: '#111111',
            bone: '#e8e4de',
            silver: '#a8a8a8',
            accent: '#8b2c2c',
          },
          fontFamily: {
            display: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            body: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
        },
      },
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    ::selection { background: rgba(139,44,44,0.4); color: #e8e4de; }
    body { background: #0a0a0a; color: #e8e4de; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    
    .glass-nav {
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .loading-spinner {
      border: 2px solid rgba(139, 44, 44, 0.2);
      border-top-color: #8b2c2c;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Navigation -->
  <nav class="glass-nav sticky top-0 z-50 w-full px-6 py-4 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3">
      <svg width="24" height="28" viewBox="0 0 72 88" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M36 8 C34 28, 38 44, 36 80" stroke="#8b2c2c" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M12 32 C20 28, 52 28, 60 32" stroke="#8b2c2c" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M28 80 C32 78, 40 78, 44 80" stroke="#8b2c2c" stroke-width="3" stroke-linecap="round" fill="none"/>
      </svg>
      <span class="font-display font-semibold text-lg tracking-wide hidden sm:block">Threshold Portal</span>
    </a>
    
    <div class="flex items-center gap-6">
      <span id="user-greeting" class="text-silver text-sm hidden sm:block"></span>
      <button onclick="logout()" class="text-xs font-mono tracking-widest uppercase text-silver/60 hover:text-white transition-colors">Logout</button>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="flex-grow w-full max-w-5xl mx-auto px-6 py-12 sm:py-20">
    
    <!-- State: Loading -->
    <div id="state-loading" class="flex flex-col items-center justify-center py-32 space-y-4">
      <div class="loading-spinner"></div>
      <p class="font-mono text-xs tracking-widest text-silver/40 uppercase">Authenticating...</p>
    </div>

    <!-- State: Error / Unauthorized -->
    <div id="state-error" class="hidden flex-col items-center justify-center py-32 text-center">
      <div class="w-16 h-16 rounded-full border border-accent/30 flex items-center justify-center mb-6">
        <span class="text-accent text-2xl">!</span>
      </div>
      <h2 class="font-display text-3xl sm:text-4xl mb-4">Access Restricted</h2>
      <p id="error-message" class="text-silver mb-8 max-w-md mx-auto leading-relaxed">Please ensure you are logged in and have purchased the program.</p>
      <a href="/" class="px-8 py-3 border border-white/20 hover:border-white/50 text-sm font-mono tracking-wider transition-colors">Return to Homepage</a>
    </div>

    <!-- State: Dashboard Content -->
    <div id="state-dashboard" class="hidden">
      <!-- Header -->
      <header class="mb-16">
        <p class="font-mono text-sm tracking-[0.3em] uppercase text-accent mb-4">The Operating Manual</p>
        <h1 class="font-display text-4xl sm:text-5xl md:text-6xl leading-[1.1] mb-6">Your Curriculum</h1>
        <div class="w-24 h-px bg-accent/50"></div>
      </header>

      <!-- Progress Overview -->
      <div class="bg-surface border border-white/[0.04] p-6 sm:p-8 rounded-sm mb-12 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
        <div>
          <h2 class="text-lg font-medium text-bone mb-1">Overall Progress</h2>
          <p id="progress-text" class="text-sm text-silver font-mono">0 of 0 lessons completed</p>
        </div>
        <div class="w-full sm:w-1/2 bg-charcoal h-2 rounded-full overflow-hidden">
          <div id="progress-bar" class="h-full bg-accent transition-all duration-1000 ease-out" style="width: 0%"></div>
        </div>
      </div>

      <!-- Modules Container -->
      <div id="modules-container" class="space-y-12">
        <!-- JS will populate this -->
      </div>
    </div>
    
  </main>

  <footer class="mt-auto border-t border-white/[0.05] py-8 text-center">
    <p class="text-silver/30 text-xs font-mono">&copy; 2026 The Threshold. Engineering transformation.</p>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
